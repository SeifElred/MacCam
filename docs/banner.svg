<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="MacCam, camera lock for the macOS menu bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#171c24"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="180" fill="#34c759" opacity="0.08"/>
  <circle cx="160" cy="320" r="140" fill="#ffffff" opacity="0.03"/>

  <g transform="translate(88,78)">
    <rect width="520" height="204" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="64" cy="64" r="22" fill="#34c759"/>
    <g transform="translate(52,50)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 10h6l2-3h8l2 3h6v14H6z"/>
      <circle cx="18" cy="17" r="4"/>
    </g>
    <text x="100" y="58" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="650">Camera Lock</text>
    <text x="100" y="84" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Locked · Idle</text>
    <rect x="400" y="48" width="52" height="32" rx="16" fill="#34c759"/>
    <circle cx="436" cy="64" r="12" fill="#ffffff"/>
    <text x="36" y="140" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Photo Booth wants the camera</text>
    <text x="36" y="168" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Allow  ·  Allow 15 min  ·  Deny</text>
  </g>

  <text x="680" y="150" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">MacCam</text>
  <text x="684" y="198" fill="#d1d1d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">The camera stays off until you say Allow.</text>
  <text x="684" y="236" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Menu bar · macOS 14+ · one password · your files stay put</text>
</svg>
